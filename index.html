<!DOCTYPE html>
<html lang="en">
<head>

    <title>PPT Grader</title>

        body {

            text-align: center;
            margin: 20px;

        .upload-section {
            margin: 20px auto;
        }
        #result {
            margin-top: 20px;
            display: none;
        }
        table {
            margin: 0 auto;
            border-collapse: collapse;
            width: 80%;

        table, th, td {

        th, td {
            padding: 10px;

    <div id="result">
        <h2>Grading Report</h2>
        <table>
            <thead>
                <tr>
                    <th>Criteria</th>
                    <th>Score</th>
                </tr>
            </thead>
            <tbody id="resultTable"></tbody>
        </table>
    </div>
    <script>
        function uploadFile() {
            const fileInput = document.getElementById('pptFile');

                alert("Please upload a PPT file.");
                return;
            }

</body>
</html>
